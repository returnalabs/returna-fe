steps:
  deploy:
    image: docker:26
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/www/returna-fe:/var/www/returna-fe
    commands:
      - cd /var/www/returna-fe
      - git pull origin master
      - docker build -t returna-fe:latest .
      - docker compose down
      - docker compose up -d
    when:
      branch: master
      event:
        - push
        - manual
